<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaxSeat System - Security Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Plus Jakarta Sans'; display: flex; justify-content: center; align-items: center; height: 100vh; overflow:hidden; background: #0f172a; }
        .theme-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }
        .theme-layer.active { opacity: 1; }
        #bg-security { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(25px); padding: 45px; border-radius: 32px; width: 420px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(30px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .alert { background: #fee2e2; color: #ef4444; padding: 15px; border-radius: 16px; margin-bottom: 20px; font-size: 14px; font-weight: 600; display:flex; gap:10px; align-items:center; }
        .input-group { position: relative; margin-bottom: 20px; width: 100%; }
        input { width: 100%; padding: 18px 20px; border: 2px solid #e2e8f0; border-radius: 16px; box-sizing: border-box; font-family: inherit; transition: 0.3s; font-size: 15px; background: #f8fafc; }
        input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        button[type="submit"] { width: 100%; padding: 18px; background: #2563eb; color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1); margin-top: 10px; }
        button[type="submit"]:hover { background: #1d4ed8; transform: translateY(-4px); box-shadow: 0 15px 25px rgba(37,99,235,0.25); }
    </style>
</head>
<body>
    <div id="bg-security" class="theme-layer active"></div>
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: #2563eb;"></i>
        </div>

        {% for m in messages %}
            <div class="alert"><i class="fa-solid fa-triangle-exclamation"></i> {{ m }}</div>
        {% endfor %}

        <h2 style="margin: 0 0 5px 0; font-weight: 800; font-size: 24px; color: #0f172a; text-align: center;">Action Required</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 30px; text-align: center; line-height: 1.5;">For security purposes, you must change your default employee password before accessing the dashboard.</p>
        
        <form method="POST" action="/change_password">
            <div class="input-group">
                <input type="password" name="new_password" placeholder="New Password (Min 6 chars)" required minlength="6">
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required minlength="6">
            </div>
            <button type="submit">Update Password & Continue</button>
        </form>
    </div>
</body>
</html>
