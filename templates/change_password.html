<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaxSeat System - Security Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* This page doesn't use layout.html, so it needs its own colors (same as the login page) */
        :root { --navy:#14211B; --mango:#C6F24E; --text-main:#14211B; --text-muted:#5E6F67; --accent-ink:#14211B; --ok:#14211B; --warn-ink:#4D6B00; --danger-ink:#4D6B00; }
        button, input, select, textarea { font-family: inherit; }
        body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow:hidden; background:#14211B; }
        .theme-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }
        .theme-layer.active { opacity: 1; }
        /* Deep green gradient with soft lime and white light spots */
        #bg-security { background:
            radial-gradient(620px 620px at 100% 0%, rgba(198,242,78,0.40), transparent 62%),
            radial-gradient(520px 520px at 0% 100%, rgba(255,255,255,0.12), transparent 64%),
            linear-gradient(160deg, #3F8D70 0%, #2F6F5A 42%, #1C4A3B 100%); }
        body { height: auto; min-height: 100vh; overflow: auto; padding: 24px; box-sizing: border-box; }
        .glass-card { width: min(440px, 100%); border-radius: 28px; box-shadow: 0 34px 70px -26px rgba(0,0,0,0.55); box-sizing: border-box; }
        .shield { width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; display: flex; align-items: center; justify-content: center;
                  background: linear-gradient(135deg, #E1FC84 0%, #B6E23A 100%); box-shadow: 0 14px 28px -12px rgba(182,226,58,0.9); }
        input { border-radius: 14px; font-size: 16px; }
        input:focus { border-color: #2F6F5A; box-shadow: 0 0 0 4px rgba(47,111,90,0.14); }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(25px); padding: 45px; border-radius: 32px; width: 420px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(30px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .alert { background:#F3FBDC; color:var(--danger-ink); padding: 15px; border-radius: 16px; margin-bottom: 20px; font-size: 14px; font-weight: 600; display:flex; gap:10px; align-items:center; }
        .input-group { position: relative; margin-bottom: 20px; width: 100%; }
        input { width: 100%; padding: 18px 20px; border:2px solid #DCE8E1; border-radius: 16px; box-sizing: border-box; font-family: inherit; transition: 0.3s; font-size: 15px; background:#F5F9F7; }
        input:focus { outline: none; border-color:var(--text-main); background:#fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--text-main) 10%, transparent); }
        button[type="submit"] { width: 100%; padding: 18px; background:#2F6F5A; color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1); margin-top: 10px; }
        button[type="submit"]:hover { background:var(--mango); color:#14211B; transform: translateY(-4px); box-shadow: 0 15px 25px color-mix(in srgb, var(--text-main) 25%, transparent); }
    </style>
</head>
<body>
    <div id="bg-security" class="theme-layer active"></div>
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <div class="shield"><i class="fa-solid fa-shield-halved" style="font-size: 32px; color:#14211B;"></i></div>
        </div>

        {% for m in messages %}
            <div class="alert"><i class="fa-solid fa-triangle-exclamation"></i> {{ m }}</div>
        {% endfor %}

        <h2 style="margin: 0 0 6px 0; font-weight: 800; font-size: 26px; color:#14211B; text-align: center;">Set your own password</h2>
        <p style="color:#5E6F67; font-size: 15px; margin-bottom: 28px; text-align: center; line-height: 1.55;">For your safety, choose a new password before you continue. Use at least 6 characters.</p>
        
        <form method="POST" action="/change_password">
            <div class="input-group">
                <input type="password" name="new_password" placeholder="New password (at least 6 characters)" required minlength="6">
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="Type the new password again" required minlength="6">
            </div>
            <button type="submit">Save password and continue</button>
        </form>
    </div>
    <script src="{{ url_for('static', path='js/peek.js') }}?v={{ ASSET_V }}"></script>
</body>
</html>
